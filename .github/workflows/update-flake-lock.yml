name: update flake lock

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday at 04:17 UTC.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Update flake.lock
        run: nix flake update --refresh
      - name: Check updated flake
        run: nix flake check --accept-flake-config --no-build --no-write-lock-file
      - name: Open lock update pull request
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-flake-lock
          delete-branch: true
          add-paths: flake.lock
          commit-message: "chore(flake): update inputs"
          title: "chore(flake): update inputs"
          body: "Update the pinned flake inputs. The Nix build must pass before merging."
      - name: Build lock update branch
        if: steps.pull-request.outputs.pull-request-operation == 'created' || steps.pull-request.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run flake.yml --ref chore/update-flake-lock
      - name: Enable auto-merge for lock update
        if: steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash
